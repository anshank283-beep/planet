<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mystery Space Colony</title>
<meta name="theme-color" content="#02030a" />
<!-- Tailwind is an enhancement: all critical layout below is also in plain CSS, so the app works even if this CDN is slow/blocked -->
<script async src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap" />
<style>
  :root { --neon:#22e6ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#02030a; overflow:hidden; color:#dff8ff;

  .hidden { display:none !important; }
  .font-title { font-family:'Orbitron', 'Segoe UI', sans-serif; }
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  .glass { background:linear-gradient(145deg, rgba(10,18,40,.78), rgba(14,8,36,.68)); border:1px solid rgba(34,230,255,.3);
    box-shadow:0 0 22px rgba(34,230,255,.15), inset 0 0 18px rgba(179,107,255,.06);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-radius:16px; }
  .neon-text { color:#eaffff; text-shadow:0 0 6px rgba(34,230,255,.9), 0 0 22px rgba(34,230,255,.55), 0 0 40px rgba(179,107,255,.4); }
  .neon-input { width:100%; background:rgba(2,6,20,.75); color:#eaffff; border:1px solid rgba(34,230,255,.35); border-radius:12px;
    padding:.7rem .9rem; outline:none; font:inherit; font-size:16px; transition:.2s; }
  .neon-input::placeholder { color:rgba(160,200,220,.5); }
  .neon-input:focus { border-color:var(--neon); box-shadow:0 0 0 2px rgba(34,230,255,.2), 0 0 18px rgba(34,230,255,.35); }

    white-space:nowrap; box-shadow:0 0 18px rgba(34,230,255,.5); transition:transform .15s, box-shadow .15s, opacity .2s; }
  .neon-btn:hover { transform:translateY(-1px); box-shadow:0 0 28px rgba(34,230,255,.8); }

    display:flex; flex-direction:column; gap:.75rem; }
  #top > * { pointer-events:auto; }
  #rightCol { width:100%; display:flex; flex-direction:column; gap:.6rem; }
  #searchWrap { position:relative; width:100%; }
  #my-badge { padding:.7rem .8rem; display:flex; flex-direction:column; gap:.55rem; animation:badgeIn .45s ease; border-color:rgba(61,255,160,.4);

  @keyframes badgeIn { from { opacity:0; transform:translateY(-10px) scale(.97); } to { opacity:1; transform:none; } }
  .mb-row { display:flex; align-items:center; gap:.6rem; min-width:0; }
  .mb-icon { font-size:1.5rem; line-height:1; filter:drop-shadow(0 0 8px rgba(34,230,255,.7)); }
  .mb-name { font-family:'Orbitron', sans-serif; font-size:.95rem; color:#eaffff; text-shadow:0 0 8px rgba(34,230,255,.8); background:none; border:0; padding:0; cursor:pointer;
    text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .mb-sub { font-size:.78rem; color:rgba(200,240,255,.65); display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
  .mb-actions { display:flex; gap:.5rem; }
  .mb-actions .ghost-btn { flex:1; padding:.5rem .7rem; font-size:.9rem; text-align:center; }
  .danger { border-color:rgba(255,80,120,.55) !important; color:#ffc2d0 !important; }
  .danger:hover { box-shadow:0 0 14px rgba(255,80,120,.5) !important; }
  .danger.armed { background:rgba(255,80,120,.25) !important; color:#fff !important; }
  #search-form { display:flex; gap:.5rem; align-items:center; padding:.5rem; }
  #search-list { position:absolute; left:0; right:0; top:100%; margin-top:4px; max-height:38vh; overflow:auto; }
  #search-list button { display:block; width:100%; text-align:left; padding:.55rem .85rem; color:#cfeeff; background:transparent; border:0; cursor:pointer; font:inherit; }
  #search-list button:hover { background:rgba(34,230,255,.14); }
  #bottom { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; flex-direction:column; align-items:center; gap:.75rem;
    padding:.75rem .75rem calc(env(safe-area-inset-bottom) + .75rem); pointer-events:none; }
  #bottom > * { pointer-events:auto; width:100%; max-width:34rem; }

  .claim-field { position:relative; flex:1; min-width:0; }
  .claim-field span { position:absolute; left:.8rem; top:50%; transform:translateY(-50%); color:rgba(120,230,255,.75); user-select:none; }
  #username { padding-left:1.8rem; }
  #info { padding:.9rem; }

  @media (min-width:768px) {

  @keyframes spin { to { transform:rotate(360deg); } }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:#ffb84d; box-shadow:0 0 8px #ffb84d; margin-right:.4rem; }

  .b-ringed { color:#d3a8ff; border-color:#d3a8ff88; box-shadow:0 0 10px #b36bff55; }
  .b-golden { color:#ffe08a; border-color:#ffd25eaa; box-shadow:0 0 14px #ffd25e88; }

</head>
<body>

<canvas id="scene"></canvas>

<div id="loader">
  <div class="spinner" id="spinner"></div>
  <div class="font-title neon-text" id="loader-text" style="font-size:.85rem;letter-spacing:.2em">LAUNCHING COLONY…</div>
  <button id="reload-btn" class="neon-btn hidden" onclick="location.reload()">RELOAD</button>
</div>

<div id="toast" class="info"></div>

<header id="top">
  <div>
    <h1 class="font-title neon-text" style="margin:0;font-weight:900;font-size:clamp(1.15rem,4.6vw,1.9rem);letter-spacing:.08em;line-height:1.1">MYSTERY SPACE COLONY</h1>
    <div style="margin-top:.45rem;font-size:.9rem;color:rgba(200,240,255,.8)">
      <span id="status-dot" class="dot"></span><span id="status-text">Connecting…</span>
      <span style="opacity:.4;margin:0 .5rem">|</span>
      <span><span id="count" class="font-title" style="color:#9ff0ff">0</span> planets</span>
    </div>
  </div>
  <div id="rightCol">
    <div id="searchWrap">
      <form id="search-form" class="glass" autocomplete="off">
        <input id="search" class="neon-input" style="padding:.55rem .8rem" placeholder="🔍 Find a username…" maxlength="31" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <button type="submit" class="neon-btn" style="padding:.6rem .85rem">GO</button>
        <button type="button" id="reset" class="ghost-btn" title="Reset view" style="padding:.5rem .75rem">⟲</button>
      </form>
      <div id="search-list" class="glass hidden"></div>
    </div>
    <!-- Shown instead of the claim form once this device has claimed a planet -->
    <section id="my-badge" class="glass hidden" aria-live="polite"></section>
  </div>
</header>

<main id="bottom">
  <section id="info" class="glass hidden">
    <div class="info-row">
      <div style="min-width:0">
        <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
          <span id="info-name" class="font-title neon-text" style="font-size:1.05rem;word-break:break-all"></span>
          <span id="info-badge" class="badge"></span>
        </div>
        <div id="info-date" style="font-size:.9rem;color:rgba(200,240,255,.65);margin-top:.3rem"></div>
      </div>
      <div style="display:flex;gap:.5rem;flex-shrink:0">
        <a id="info-link" class="ghost-btn" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
        <button id="info-close" class="ghost-btn" aria-label="Close">✕</button>
      </div>
    </div>
  </section>

  <form id="claim-form" class="glass" autocomplete="off">
    <label for="username" class="font-title" style="display:block;font-size:.68rem;letter-spacing:.2em;color:rgba(160,235,255,.85);margin-bottom:.5rem">CLAIM YOUR PLANET</label>
    <div class="claim-row">
      <div class="claim-field">
        <span>@</span>
        <input id="username" class="neon-input" placeholder="your_instagram" maxlength="31" autocapitalize="none" autocorrect="off" spellcheck="false" />
      </div>
      <button id="claim-btn" type="submit" class="neon-btn">CLAIM MY PLANET</button>
    </div>
    <p style="font-size:.78rem;color:rgba(200,240,255,.5);margin:.5rem 0 0">70% rocky · 20% ringed · 10% rare golden</p>
  </form>
</main>

<script>

/* ───────── Stars ───────── */

  var c = document.createElement('canvas'); c.width = 256; c.height = 128; var g = c.getContext('2d'), i;

    removePlanet(newKey); cacheDel(newKey); addPlanet(oldData); cacheAdd(oldData); saveMyClaim(oldName);
    if (err && err.code === 'permission-denied') toast('Rename blocked by database rules. Update Firestore rules to allow it.', 'error', 6500);
    else toast('Could not rename your planet. Please try again.', 'error', 5000);
  });
}

function deleteClaim() {
  if (!myClaim) return;
  var name = myClaim.username, key = name.toLowerCase(), p = planets[key];
  var backup = { username: name, type: p ? p.type : 'rocky', seed: p && p.data.seed != null ? p.data.seed : null, createdAt: p ? p.data.createdAt : new Date() };

  // optimistic: remove planet, forget the claim, bring the form back
  removePlanet(key); cacheDel(key); clearMyClaim();
  toast('🗑️ Planet deleted. You can claim a new one.', 'info', 3200);

  withTimeout(whenDb(function () { return col.doc(key).delete(); }), 8000).catch(function (err) {
    if (err && err.code === 'timeout') { toast('Deleted on this device — it will sync once the database connects.', 'info', 4500); return; }
    console.error('[Firestore delete]', err);
    addPlanet(backup); cacheAdd(backup); saveMyClaim(name);   // restore
    if (err && err.code === 'permission-denied') toast('Delete blocked by database rules. Update Firestore rules to allow it.', 'error', 6500);
    else toast('Could not delete your planet. Please try again.', 'error', 5000);
  });
}

renderClaim();   // restore claimed state from localStorage on load

/* ═════════════ Search ═════════════ */
var searchInput = $('search'), listEl = $('search-list');
function hideList() { listEl.classList.add('hidden'); listEl.innerHTML = ''; }
searchInput.addEventListener('input', function () {
  var q = normalize(searchInput.value).toLowerCase(); listEl.innerHTML = '';
  if (!q) return hideList();
  var matches = Object.keys(planets).filter(function (k) { return k.indexOf(q) !== -1; }).slice(0, 8);
  if (!matches.length) return hideList();
  matches.forEach(function (k) {
    var p = planets[k], b = document.createElement('button'); b.type = 'button';
    b.textContent = '@' + p.data.username + (p.type === 'golden' ? '  ✨' : p.type === 'ringed' ? '  🪐' : '');
    b.addEventListener('click', function () { searchInput.value = p.data.username; hideList(); focusPlanet(k); searchInput.blur(); });
    listEl.appendChild(b);
  });
  listEl.classList.remove('hidden');
});
document.addEventListener('click', function (e) { if (!$('searchWrap').contains(e.target)) hideList(); });
$('search-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var q = normalize(searchInput.value).toLowerCase(); if (!q) return; hideList();
  var key = planets[q] ? q : Object.keys(planets).filter(function (k) { return k.indexOf(q) !== -1; })[0];
  if (key && focusPlanet(key)) { searchInput.blur(); toast('🚀 Flying to @' + planets[key].data.username, 'info', 1800); }
  else toast('No planet found for “' + q + '”', 'error');
});
$('reset').addEventListener('click', function () {
  if (focus) clearFocus(); else { resetting = true; cam.goalDist = HOME_DIST; flyUntil = performance.now() + 2400; }
});
$('info-close').addEventListener('click', clearFocus);

} // startApp
})();
</script>
</body>
